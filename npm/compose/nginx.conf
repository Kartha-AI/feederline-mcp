# SPDX-License-Identifier: Apache-2.0
# Two MCP replicas behind one endpoint. Requests hash on Mcp-Session-Id so a session normally stays on one
# replica; when that replica is down the request moves to the other, which rehydrates the session from the shared
# snapshot store. initialize carries no session id yet and may land on either replica.
upstream mcp {
    hash $http_mcp_session_id consistent;
    server mcp:8000 max_fails=1 fail_timeout=5s;
    server mcp-b:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 8000;

    location / {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;                       # SSE responses stream through
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
        add_header X-Upstream $upstream_addr always;
    }
}
