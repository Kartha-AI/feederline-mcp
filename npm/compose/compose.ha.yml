# Optional failover demo: `npx -y @kartha-energy/feederline-mcp up --ha`.
# A second replica and nginx hashing on Mcp-Session-Id; either replica rehydrates a session from the shared
# snapshot volume when the other stops.
services:
  mcp:
    ports: !reset []

  mcp-b:
    extends: { file: docker-compose.yml, service: mcp }
    hostname: mcp-b
    ports: !reset []

  proxy:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:${FEEDERLINE_MCP_PORT:-8000}:8000"]
    depends_on: { mcp: { condition: service_healthy }, mcp-b: { condition: service_healthy } }
    restart: unless-stopped
